# XcodeGen spec. Generate the project with: xcodegen generate
# TinyTimer.xcodeproj is generated from this file and is not committed.
name: TinyTimer

options:
  bundleIdPrefix: local.tinytimer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

targets:
  TinyTimerCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/TinyTimerCore
    settings:
      base:
        PRODUCT_NAME: TinyTimerCore
        SKIP_INSTALL: YES
    dependencies:
      - sdk: libsqlite3.tbd

  TinyTimer:
    type: application
    platform: macOS
    sources:
      - path: Sources/TinyTimer
      - path: Resources/Assets.xcassets
    dependencies:
      - target: TinyTimerCore
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_NAME: TinyTimer
        PRODUCT_BUNDLE_IDENTIFIER: local.tinytimer.TinyTimer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TinyTimer
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO

schemes:
  TinyTimer:
    build:
      targets:
        TinyTimer: all
    run:
      config: Debug
    archive:
      config: Release
