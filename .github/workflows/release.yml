name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          ls -d /Applications/Xcode*
          swift --version
          echo "::notice::$(swift --version 2>&1 | head -1) | $(ls -d /Applications/Xcode* | tr '\n' ' ')"

      - name: Build
        run: |
          set -o pipefail
          if ! swift build --build-system native 2>&1 | tee build.log; then
            grep -E "error:" build.log | sort -u | head -30 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Self-test
        run: |
          set -o pipefail
          if ! swift run --build-system native --skip-build TinyTimer --selftest 2>&1 | tee selftest.log; then
            grep -iE "error|fail" selftest.log | head -30 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Build app bundle
        run: ./bundle.sh

      - name: Zip
        run: ditto -c -k --keepParent build/TinyTimer.app TinyTimer.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" TinyTimer.zip \
            --target "${GITHUB_SHA}" \
            --latest \
            --title "TinyTimer ${VERSION}" \
            --notes "Automated build of ${GITHUB_SHA::7}. Apple Silicon (arm64), macOS 14+. Ad-hoc signed, not notarized: see the README Download section."
